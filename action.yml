name: "SOFE Evaluate"
description: "Run SOFE FinOps policy evaluations — scan live AWS resources or Terraform plans pre-deploy, or open a remediation PR."
author: "breakingthecloud"

branding:
  icon: "shield"
  color: "green"

inputs:
  api-key:
    description: "SOFE API key (sk_sofe_xxx) or Bearer token. Get one at platform.sofe.dev"
    required: true
  mode:
    description: "Evaluation mode: 'cloud' (scan live AWS resources), 'terraform' (scan plan file), or 'remediation' (open a PR with fixes)"
    required: false
    default: "cloud"
  plan-file:
    description: "Path to tfplan.json file (required when mode=terraform)"
    required: false
    default: ""
  eval-id:
    description: "Evaluation ID to remediate (required when mode=remediation)"
    required: false
    default: ""
  base-path:
    description: "Repo path where the remediation .tf is written (mode=remediation)"
    required: false
    default: "sofe/remediation"
  base:
    description: "Base branch for the remediation PR (mode=remediation, default: repo default branch)"
    required: false
    default: ""
  pr-title:
    description: "PR title (mode=remediation)"
    required: false
    default: "SOFE remediation: apply FinOps fixes"
  github-token:
    description: "GitHub token with contents:write + pull-requests:write (mode=remediation, default: github.token)"
    required: false
    default: "${{ github.token }}"
  fail-on:
    description: "Fail the workflow if findings at or above severity (critical|high|medium|low)"
    required: false
    default: ""
  resource-types:
    description: "Comma-separated resource types to evaluate (cloud mode only, e.g., aws.ec2,aws.s3)"
    required: false
    default: ""
  format:
    description: "Output format: table, json, or markdown"
    required: false
    default: "table"
  version:
    description: "SOFE CLI version to install (cloud mode only, default: latest)"
    required: false
    default: "latest"

outputs:
  findings-count:
    description: "Number of findings detected"
  resources-scanned:
    description: "Number of resources scanned"
  remediation-count:
    description: "Number of remediations applied (mode=remediation)"
  pr-number:
    description: "Pull request number opened (mode=remediation)"
  failed:
    description: "Whether the evaluation failed (based on fail-on threshold)"

runs:
  using: "composite"
  steps:
    - name: Generate remediation module
      if: inputs.mode == 'remediation'
      id: remediation
      shell: bash
      env:
        SOFE_API_KEY: ${{ inputs.api-key }}
      run: |
        EVAL_ID="${{ inputs.eval-id }}"

        if [ -z "$EVAL_ID" ]; then
          echo "❌ Error: eval-id is required when mode=remediation"
          exit 1
        fi

        echo "🛠️ Fetching remediation plan for eval: $EVAL_ID"
        RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $SOFE_API_KEY" \
          "https://api.sofe.dev/evaluations/$EVAL_ID/remediation-tf")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" -ne 200 ]; then
          echo "❌ API error (HTTP $HTTP_CODE): $BODY"
          exit 1
        fi

        REMEDIATION_COUNT=$(echo "$BODY" | jq -r '.remediation_count // 0')
        TF_CONTENT=$(echo "$BODY" | jq -r '.terraform')
        MODULE=$(echo "$BODY" | jq -r '.module // ""')

        echo "  ⚡ Remediations: $REMEDIATION_COUNT"
        echo "  📦 Module: $MODULE"

        if [ "$REMEDIATION_COUNT" -eq 0 ]; then
          echo "  ✅ No remediations needed — skipping PR"
          echo "remediation-count=0" >> $GITHUB_OUTPUT
          exit 0
        fi

        BASE_PATH="${{ inputs.base-path }}"
        mkdir -p "${GITHUB_WORKSPACE}/${BASE_PATH}"
        echo "$TF_CONTENT" > "${GITHUB_WORKSPACE}/${BASE_PATH}/remediation.tf"
        echo "  📄 Written to ${BASE_PATH}/remediation.tf"

        echo "remediation-count=$REMEDIATION_COUNT" >> $GITHUB_OUTPUT

    - name: Open remediation PR
      if: inputs.mode == 'remediation' && steps.remediation.outputs.remediation-count != '0'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const basePath = core.getInput('base-path') || 'sofe/remediation';
          const evalId = core.getInput('eval-id');
          const prTitle = core.getInput('pr-title');
          const base = core.getInput('base') || context.payload.repository?.default_branch || 'main';
          const branch = `sofe/remediation-${evalId}`;
          const tfPath = `${basePath}/remediation.tf`;

          const content = fs.readFileSync(tfPath, 'utf8');
          const { owner, repo } = context.repo;

          // 1. Base branch SHA
          let baseSha;
          try {
            baseSha = (await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` })).data.object.sha;
          } catch (e) {
            throw new Error(`Base branch '${base}' not found: ${e.message}`);
          }

          // 2. Reset branch, then recreate from base
          try {
            await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
          } catch (e) {}
          await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: baseSha });

          // 3. Commit the remediation module
          const blob = (await github.rest.git.createBlob({ owner, repo, content })).data.sha;
          const tree = (await github.rest.git.createTree({ owner, repo, base_tree: baseSha, tree: [{ path: tfPath, mode: '100644', type: 'blob', sha: blob }] })).data.sha;
          const commit = (await github.rest.git.createCommit({ owner, repo, message: `SOFE remediation: apply FinOps fixes (eval ${evalId})`, tree, parents: [baseSha] })).data.sha;
          await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit, force: true });

          // 4. Open (or reuse) the PR
          const existing = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: 'open' });
          let prNumber;
          if (existing.data.length === 0) {
            const pr = await github.rest.pulls.create({
              owner, repo, title: prTitle, head: branch, base,
              body: `## 🛠️ SOFE Remediation (eval \`${evalId}\`)\n\nAuto-PR con fixes Terraform generados por SOFE. **Revisa y aprueba antes de mergear** — los recursos reales solo cambian con \`terraform apply\`.\n\n- Módulo: \`${basePath}/remediation.tf\`\n- Review recomendada: S3 encryption/versioning, tags, lifecycle rules, Lambda runtime, API Gateway settings\n- Aplica con: \`terraform plan\` + \`terraform apply\` en tu pipeline\n\n<sub>Generado por [SOFE](https://sofe.dev) — remediation-as-code (S061).</sub>`,
            });
            prNumber = pr.data.number;
          } else {
            prNumber = existing.data[0].number;
          }
          core.setOutput('pr-number', prNumber);
          console.log(`🔀 PR #${prNumber} ready: ${base} ← ${branch}`);

    - name: SOFE Terraform Scan
      if: inputs.mode == 'terraform'
      id: terraform
      shell: bash
      run: |
        PLAN_FILE="${{ inputs.plan-file }}"

        if [ -z "$PLAN_FILE" ]; then
          echo "❌ Error: plan-file is required when mode=terraform"
          exit 1
        fi

        if [ ! -f "$PLAN_FILE" ]; then
          echo "❌ Error: Plan file not found: $PLAN_FILE"
          exit 1
        fi

        echo "🔍 Scanning Terraform plan: $PLAN_FILE"
        PLAN_JSON=$(cat "$PLAN_FILE")

        # Call SOFE API terraform/scan endpoint
        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.sofe.dev/terraform/scan" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ inputs.api-key }}" \
          -d "{\"plan_json\": $PLAN_JSON}")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" -ne 200 ]; then
          echo "❌ API error (HTTP $HTTP_CODE): $BODY"
          exit 1
        fi

        # Parse results
        FINDINGS_COUNT=$(echo "$BODY" | jq -r '.findings_count // 0')
        RESOURCES_SCANNED=$(echo "$BODY" | jq -r '.resource_count // 0')
        POLICIES_CHECKED=$(echo "$BODY" | jq -r '.policies_checked // 0')

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  SOFE Terraform Pre-Deploy Scan Results"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📦 Resources scanned:  $RESOURCES_SCANNED"
        echo "  📋 Policies checked:   $POLICIES_CHECKED"
        echo "  ⚡ Findings:           $FINDINGS_COUNT"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""

        # Display findings
        if [ "$FINDINGS_COUNT" -gt 0 ]; then
          if [ "${{ inputs.format }}" = "json" ]; then
            echo "$BODY" | jq '.findings'
          else
            echo "$BODY" | jq -r '.findings[] | "  \(.severity | ascii_upcase) | \(.policy_name) | \(.resource_id)\n         → \(.message)\n         💡 \(.remediation)\n"'
          fi
        else
          echo "  ✅ No policy violations found!"
        fi

        # Set outputs
        echo "findings-count=$FINDINGS_COUNT" >> $GITHUB_OUTPUT
        echo "resources-scanned=$RESOURCES_SCANNED" >> $GITHUB_OUTPUT

        # Check fail-on threshold
        FAIL_ON="${{ inputs.fail-on }}"
        FAILED="false"
        if [ -n "$FAIL_ON" ] && [ "$FINDINGS_COUNT" -gt 0 ]; then
          # Map severity to numeric for comparison
          sev_to_num() {
            case "$1" in critical) echo 4 ;; high) echo 3 ;; medium) echo 2 ;; low) echo 1 ;; *) echo 0 ;; esac
          }
          THRESHOLD=$(sev_to_num "$FAIL_ON")
          MAX_SEV=$(echo "$BODY" | jq -r '[.findings[].severity] | map(if . == "critical" then 4 elif . == "high" then 3 elif . == "medium" then 2 elif . == "low" then 1 else 0 end) | max // 0')

          if [ "$MAX_SEV" -ge "$THRESHOLD" ]; then
            echo ""
            echo "❌ Pipeline FAILED: findings with severity >= $FAIL_ON detected"
            FAILED="true"
          fi
        fi

        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        if [ "$FAILED" = "true" ]; then exit 1; fi

    - name: Install SOFE CLI
      if: inputs.mode == 'cloud'
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          # install.sh verifies the SHA-256 checksum against checksums.txt
          curl -fsSL https://sofe.dev/install.sh | bash
        else
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in x86_64) ARCH="amd64" ;; aarch64|arm64) ARCH="arm64" ;; esac
          curl -fsSL "https://github.com/breakingthecloud/sofe-cli/releases/download/v${VERSION}/checksums.txt" -o checksums.txt
          curl -fsSL "https://github.com/breakingthecloud/sofe-cli/releases/download/v${VERSION}/sofe_${VERSION}_${OS}_${ARCH}.tar.gz" -o sofe.tar.gz
          EXPECTED=$(grep "sofe_${VERSION}_${OS}_${ARCH}.tar.gz" checksums.txt | awk '{print $1}' | head -1)
          ACTUAL=$(sha256sum sofe.tar.gz | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ Checksum mismatch. Expected $EXPECTED, got $ACTUAL" >&2
            exit 1
          fi
          tar -xzf sofe.tar.gz
          sudo mv sofe /usr/local/bin/sofe
          rm sofe.tar.gz checksums.txt
        fi
        sofe --version

    - name: Run cloud evaluation
      if: inputs.mode == 'cloud'
      id: evaluate
      shell: bash
      env:
        SOFE_API_KEY: ${{ inputs.api-key }}
      run: |
        ARGS="--cloud --format ${{ inputs.format }}"

        if [ -n "${{ inputs.fail-on }}" ]; then
          ARGS="$ARGS --fail-on ${{ inputs.fail-on }}"
        fi

        if [ -n "${{ inputs.resource-types }}" ]; then
          ARGS="$ARGS --resource-types ${{ inputs.resource-types }}"
        fi

        echo "🔍 Running: sofe evaluate $ARGS"
        OUTPUT=$(sofe evaluate $ARGS 2>&1) || EXIT_CODE=$?
        echo "$OUTPUT"

        # Parse findings count from output
        FINDINGS=$(echo "$OUTPUT" | grep -oP '⚡ \K\d+' || echo "0")
        RESOURCES=$(echo "$OUTPUT" | grep -oP '\d+(?= resources scanned)' || echo "0")

        echo "findings-count=$FINDINGS" >> $GITHUB_OUTPUT
        echo "resources-scanned=$RESOURCES" >> $GITHUB_OUTPUT

        if [ "${EXIT_CODE:-0}" -ne 0 ]; then
          echo "failed=true" >> $GITHUB_OUTPUT
          exit 1
        else
          echo "failed=false" >> $GITHUB_OUTPUT
        fi
